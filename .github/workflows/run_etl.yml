name: Ejecutar ETL cada hora

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: etl-group
  cancel-in-progress: false

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout del repositorio
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # ### FIX: Necesario para que el rebase funcione

      - name: 2. Configurar entorno de Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: 3. Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. Ejecutar el script ETL
        env:
          API_TOKEN: ${{ secrets.API_TOKEN }}
          API_URL_TRIPS: ${{ secrets.API_URL_TRIPS }}
          API_URL_ASSETS: ${{ secrets.API_URL_ASSETS }}
          SAMSARA_TAGS_URL: ${{ secrets.SAMSARA_TAGS_URL }}
        run: python temporal.py

      - name: 5. Sincronizar y Subir cambios
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          git add data/resultado_etl.csv
          
          # No hacer nada si el archivo no cambió
          if git diff --staged --quiet; then
            echo "Sin cambios detectados."
            exit 0
          fi
          
          git commit -m "Actualización automática de datos ETL"
          
          # ### FIX: -X theirs obliga a aceptar tus datos nuevos si hay conflicto
          git pull --rebase -X theirs origin Rama-tiempo-detenido
          
          git push origin Rama-tiempo-detenido
