# .github/workflows/run_etl.yml
name: Ejecutar ETL cada hora

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

# EVITA CONFLICTOS: Solo permite que un proceso ETL corra a la vez
concurrency:
  group: etl-group
  cancel-in-progress: false

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout del repositorio
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # Descarga todo el historial para evitar errores de rebase

      - name: 2. Configurar entorno de Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: 3. Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. Ejecutar el script ETL
        env:
          API_TOKEN: ${{ secrets.API_TOKEN }}
          API_URL_TRIPS: ${{ secrets.API_URL_TRIPS }}
          API_URL_ASSETS: ${{ secrets.API_URL_ASSETS }}
          SAMSARA_TAGS_URL: ${{ secrets.SAMSARA_TAGS_URL }}
        run: python temporal.py

      - name: 5. Sincronizar y Subir cambios
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          git add data/resultado_etl.csv
          
          # Si no hay cambios, termina el proceso sin error
          if git diff --staged --quiet; then
            echo "No hay cambios en los datos. Saltando push."
            exit 0
          fi
          
          git commit -m "Actualización automática de datos ETL"
          
          # SOLUCIÓN AL ERROR: Trae cambios remotos que pudieron ocurrir mientras corría python
          git pull --rebase origin Rama-tiempo-detenido
          
          # Empuja específicamente a tu rama
          git push origin Rama-tiempo-detenido