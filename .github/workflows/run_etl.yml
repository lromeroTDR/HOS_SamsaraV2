# .github/workflows/run_etl.yml
name: Ejecutar ETL cada hora

on:
  schedule:
    # Se ejecuta a la hora 0 de cada hora (e.g., 01:00, 02:00, etc.)
    - cron: '0 * * * *'
  workflow_dispatch: # Permite la ejecución manual desde la pestaña de Actions en GitHub

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout del repositorio
        uses: actions/checkout@v3

      - name: 2. Configurar entorno de Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9' # Puedes ajustar la versión según tu necesidad

      - name: 3. Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. Ejecutar el script ETL
        env:
          # Estos secretos deben ser configurados en GitHub
          # Ve a tu repositorio > Settings > Secrets and variables > Actions > New repository secret
          API_TOKEN: ${{ secrets.API_TOKEN }}
          API_URL_TRIPS: ${{ secrets.API_URL_TRIPS }}
          API_URL_ASSETS: ${{ secrets.API_URL_ASSETS }}
          SAMSARA_TAGS_URL: ${{ secrets.SAMSARA_TAGS_URL }}
        run: python temporal.py

      - name: 5. Hacer commit del archivo CSV
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/resultado_etl.csv
          # Solo hace commit si hay cambios en el archivo
          git diff --staged --quiet || git commit -m "Actualización automática de datos ETL"
          git push
