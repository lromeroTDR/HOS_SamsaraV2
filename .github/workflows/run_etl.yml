name: Ejecutar ETL cada hora
on:
  # Cambiamos el orden para que GitHub priorice la lectura del cron
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
  # Añadimos este trigger para que cada vez que hagas push, GitHub revise el cron
  push:
    branches:
      - Rama-tiempo-detenido  
# Esto evita que dos procesos corran al mismo tiempo y causen conflictos
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout del repositorio
        uses: actions/checkout@v3
        with:
          # Descarga todo el historial para que el rebase no falle
          fetch-depth: 0

      - name: 2. Configurar entorno de Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: 3. Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: 4. Ejecutar el script ETL
        env:
          API_TOKEN: ${{ secrets.API_TOKEN }}
          API_URL_TRIPS: ${{ secrets.API_URL_TRIPS }}
          API_URL_ASSETS: ${{ secrets.API_URL_ASSETS }}
          SAMSARA_TAGS_URL: ${{ secrets.SAMSARA_TAGS_URL }}
        run: python temporal.py

      - name: 5. Sincronizar y Forzar subida de datos
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Añadir el archivo CSV resultante
          git add data/resultado_etl.csv
          
          # Si no hay cambios, terminar pacíficamente
          if git diff --staged --quiet; then
            echo "No hay cambios en los datos. Finalizando..."
            exit 0
          fi
          
          # Crear el commit
          git commit -m "Actualización automática de datos ETL"
          
          # LA SOLUCIÓN DEFINITIVA: 
          # Pull con rebase usando la estrategia 'theirs'. 
          # En un rebase, 'theirs' significa que tus cambios locales (el nuevo ETL) 
          # tienen prioridad sobre lo que esté en el servidor.
          git pull --rebase -X theirs origin Rama-tiempo-detenido
          
          # Push final a la rama
          git push origin Rama-tiempo-detenido
